# Base PostgreSQL locale pour le développement :  docker compose up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: materna
    ports:
      - "5432:5432"
    volumes:
      - materna-pg:/var/lib/postgresql/data
volumes:
  materna-pg:
